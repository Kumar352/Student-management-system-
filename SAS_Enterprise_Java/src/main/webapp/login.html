<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAS | Secure Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0f172a; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: 'Inter', sans-serif; margin: 0; color: #f8fafc; }
        .login-card { background: #1e293b; padding: 40px; border-radius: 12px; border: 1px solid #334155; width: 380px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .icon-container { width: 60px; height: 60px; background: rgba(14, 165, 233, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: #0ea5e9; font-size: 24px; }
        h2 { margin: 0 0 5px 0; font-size: 24px; }
        p { font-size: 13px; color: #94a3b8; margin-bottom: 25px; }
        .input-group { text-align: left; margin-bottom: 16px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
        input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 8px; box-sizing: border-box; outline: none; transition: 0.2s; }
        input:focus { border-color: #0ea5e9; box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.4); }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #0ea5e9, #0284c7); color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(14, 165, 233, 0.4); }
        .error-msg { background: rgba(239, 68, 68, 0.1); color: #ef4444; padding: 10px; border-radius: 6px; font-size: 13px; font-weight: 600; display: none; margin-bottom: 20px; border: 1px solid rgba(239,68,68,0.3); }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="icon-container"><i class="fa-solid fa-shield-halved"></i></div>
        <h2>SAS Gateway</h2>
        <p>Authorized Enterprise Access Only</p>
        <div id="errorMsg" class="error-msg"><i class="fa-solid fa-circle-exclamation"></i> Invalid credentials</div>
        
        <div class="input-group"><label>Username</label><input type="text" id="user" placeholder="Enter 'admin'"></div>
        <div class="input-group"><label>Password</label><input type="password" id="pass" placeholder="Enter 'admin123'"></div>
        <button onclick="attemptLogin()">Authenticate Session</button>
    </div>

    <script>
        function attemptLogin() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            fetch('/SAS_Enterprise_Java/api/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ username: u, password: p })
            }).then(res => {
                if (res.ok) window.location.href = 'index.html';
                else document.getElementById('errorMsg').style.display = 'block';
            });
        }
    </script>
</body>
</html>
